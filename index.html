<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7c86" id="tc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Papelería</title>
<style>
:root{--c:#0e7c86;--a:#f5a524;--bg:#f3f6f8;--tx:#1d2b36;--mu:#6b7c88;--bd:#dbe3e8;--ok:#1a8a4a;--rd:#c8372d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--c);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
header.top img{height:34px;width:34px;border-radius:8px;object-fit:cover;background:#fff}
header.top b{font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{font-size:12px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;white-space:nowrap}
.dot.off{background:var(--a);color:#222}
main{max-width:1100px;margin:0 auto;padding:14px 12px 96px}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
nav.bar button{flex:1 0 auto;min-width:68px;border:0;background:none;padding:7px 6px 6px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav.bar button span{font-size:20px;line-height:1.1}
nav.bar button.on{color:var(--c);font-weight:700;box-shadow:inset 0 3px 0 var(--c)}
@media(min-width:900px){nav.bar{top:56px;bottom:0;right:auto;width:96px;flex-direction:column;border-top:0;border-right:1px solid var(--bd)}nav.bar button{flex:0 0 auto;padding:12px 4px}nav.bar button.on{box-shadow:inset 3px 0 0 var(--c)}main{margin-left:110px;max-width:none;padding-right:20px}}
h2{margin:6px 0 10px;font-size:20px}h3{margin:14px 0 8px;font-size:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:21px}
.kpi.al b{color:var(--rd)}
.btn{border:0;background:var(--c);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--c);border:1.5px solid var(--c)}
.btn.am{background:var(--a);color:#222}
.btn.rd{background:var(--rd)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sp{flex:1}
input,select,textarea{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:9px 10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--c)}
label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}.row .g{flex:1;min-width:0}.row small{color:var(--mu);display:block}
.r{text-align:right}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#e8eff3;color:#385060}
.pill.rd{background:#fde4e1;color:var(--rd)}.pill.ok{background:#dff3e7;color:var(--ok)}.pill.am{background:#fdf0d4;color:#8a5a00}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}table.t th{background:#e9f0f3;text-align:left;padding:7px;font-size:12.5px}table.t td{padding:7px;border-bottom:1px solid var(--bd)}table.t td.r,table.t th.r{text-align:right}
.tw{overflow-x:auto}
.banner{background:#fff7e0;border:1px solid #f2d27a;border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner.rd{background:#fde8e6;border-color:#f3b1ab}
#ov{position:fixed;inset:0;background:rgba(15,30,40,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:18px 10px;overflow:auto}
#ov.on{display:flex}
.m{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.3)}.m.w{max-width:760px}
.m h3{margin:0 0 6px;font-size:18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;z-index:80;display:none;max-width:90%;text-align:center}
.cartrow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--bd);background:#fff;font-size:17px}.qty input{width:56px;text-align:center;padding:5px}
.pos{display:grid;gap:12px}@media(min-width:900px){.pos{grid-template-columns:1fr 1fr}}
.pick{display:flex;flex-wrap:wrap;gap:6px}.pick button{border:1.5px solid var(--bd);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;min-width:130px}.pick button small{display:block;color:var(--mu)}
.big{font-size:26px;font-weight:800}
.lock{max-width:320px;margin:20vh auto;text-align:center;background:#fff;padding:24px;border-radius:14px}
.lock input{text-align:center;font-size:26px;letter-spacing:8px}
/*cam*/.camw{position:relative;display:none;width:100%;max-width:340px;margin:8px auto 0;border-radius:10px;overflow:hidden;background:#000}.camw.on{display:block}.camw video{width:100%;height:100%;display:block;max-height:none}
.camw .aim{position:absolute;left:15%;right:15%;top:35%;height:30%;border:2.5px solid #f5a524;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.55)}.camw .aim::after{content:'';position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff4b3a}
video.cam{width:100%;border-radius:10px;background:#000;max-height:60vh}
.ticket{font:13px/1.35 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:#fafafa;border:1px dashed var(--bd);padding:10px;border-radius:8px}
.ml{display:flex;gap:6px;align-items:center}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;display:block!important;background:none;padding:0}.m{box-shadow:none;max-width:none}.noprint{display:none!important}}
body.dark{--bg:#10181d;--tx:#e6edf1;--mu:#93a4af;--bd:#2a3841}
body.dark .card,body.dark .m,body.dark .kpi,body.dark nav.bar,body.dark input,body.dark select,body.dark textarea,body.dark .qty button,body.dark .pick button,body.dark .lock{background:#1a252c!important;color:var(--tx)!important}
body.dark table.t th{background:#223038}body.dark .banner{background:#2d2a1a;border-color:#6b5a1d}body.dark .banner.rd{background:#3a1f1c;border-color:#7a3028}
#splash{position:fixed;inset:0;z-index:99;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s}#splash.out{opacity:0}#splash img{height:96px;width:96px;border-radius:22px;object-fit:cover;background:#fff}#splash .sl{font-size:72px}#splash .sn{font-size:22px;font-weight:700}
.etqs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.etq{border:1px dashed #999;padding:5px;text-align:center;font-size:10px;background:#fff;color:#000;break-inside:avoid}.etq svg{width:100%;height:auto}.etq .en{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.etq .ep{font-weight:700;font-size:12px}
@media print{.m{max-height:none!important;overflow:visible!important}#ov{overflow:visible!important}}
</style>
</head>
<body>
<div id="app"></div><div id="ov"></div><div id="toast"></div>
<script>
/* ===== MARCA POR DEFECTO (para revender: cambia estos tres valores) ===== */
const BRAND={nombre:'Papelería Demo',color:'#0e7c86',acento:'#f5a524'};
/* ======================================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$ '+Math.round(n||0).toLocaleString('es-CO');
const num=x=>{const n=parseFloat(String(x).replace(',','.'));return isFinite(n)?n:0};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>ymd(new Date());
const ahora=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const addD=(f,n)=>{const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diffD=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r3=n=>Math.round(n*1000)/1000;
let S=null,view='inicio',locked=false,cart=[],deferred=null,cam=null;

/* ---------- Almacenamiento local (IndexedDB + copia en localStorage) ---------- */
const DB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('papeleria_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{DB.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
 get(k){return new Promise(res=>{if(!DB.db)return res(null);try{const q=DB.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 set(k,v){return new Promise(res=>{if(!DB.db)return res(false);try{const t=DB.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}};
let st=null;
function save(){clearTimeout(st);st=setTimeout(persist,120)}
async function persist(){if(!S)return;const s=JSON.stringify(S);await DB.set('state',s);try{localStorage.setItem('pap_state',s)}catch(e){}}
window.addEventListener('pagehide',()=>{if(S){const s=JSON.stringify(S);try{localStorage.setItem('pap_state',s)}catch(e){}}});
const nuevo=()=>({v:1,cfg:{nombre:BRAND.nombre,color:BRAND.color,acento:BRAND.acento,logo:'',pin:'',resp:'',base:0,neg:false,ini:false,nc:0,meta:0,dark:false,ver:2},listas:[],prod:[],prv:[],cli:[],mov:[],ven:[],com:[],abo:[],gas:[],cie:[],n:{ven:0,com:0}});
function brand(){const c=S.cfg;document.documentElement.style.setProperty('--c',c.color||BRAND.color);document.documentElement.style.setProperty('--a',c.acento||BRAND.acento);document.title=c.nombre;$('#tc').setAttribute('content',c.color||BRAND.color)}

/* ---------- Utilidades de datos ---------- */
const P=id=>S.prod.find(x=>x.id===id);
const isKit=p=>p&&p.kit&&p.kit.length;
const disp=p=>isKit(p)?Math.min(...p.kit.map(k=>{const c=P(k.id);return c?Math.floor(c.stock/k.q):0})):p.stock;
const costoKit=p=>p.kit.reduce((a,k)=>{const c=P(k.id);return a+(c?c.costo*k.q:0)},0);
const costoDe=p=>isKit(p)?costoKit(p):p.costo;
const prvN=id=>{const x=S.prv.find(y=>y.id===id);return x?x.nombre:'—'};
const cliN=id=>{const x=S.cli.find(y=>y.id===id);return x?x.nombre:'Mostrador'};
function mover(p,q,t,ref,nota,costo){p.stock=r3(p.stock+q);S.mov.push({id:uid(),f:cur.f,h:cur.h,p:p.id,q,t,ref:ref||'',nota:nota||'',costo:costo==null?p.costo:costo,s:p.stock})}
let cur={f:'',h:''};const stamp=(f,h)=>{cur={f:f||hoy(),h:h||ahora()}};
function crearVenta(items,medio,cli,desc,f,h){stamp(f,h);S.n.ven++;const num='V-'+String(S.n.ven).padStart(5,'0');
 const its=items.map(i=>{const p=P(i.p);const costo=costoDe(p);
  if(isKit(p))p.kit.forEach(k=>{const c=P(k.id);if(c)mover(c,-i.q*k.q,'venta',num,'kit '+p.nombre)});else mover(p,-i.q,'venta',num);
  return{p:p.id,n:p.nombre,q:i.q,precio:i.precio,costo}});
 const sub=its.reduce((a,i)=>a+i.q*i.precio,0),total=Math.max(0,sub-(desc||0));
 const v={id:uid(),num,f:cur.f,h:cur.h,items:its,sub,desc:desc||0,total,medio,cli:cli||'',anulada:false};S.ven.push(v);save();return v}
function crearCompra(prov,items,pago,f,nota){stamp(f);S.n.com++;const num='C-'+String(S.n.com).padStart(5,'0');let total=0;
 items.forEach(i=>{const p=P(i.p);const base=Math.max(0,p.stock);const nc=base+i.q>0?(base*p.costo+i.q*i.costo)/(base+i.q):i.costo;p.costo=Math.round(nc*100)/100;mover(p,i.q,'entrada',num,'',i.costo);total+=i.q*i.costo});
 const c={id:uid(),num,f:cur.f,prov,items:items.map(i=>({p:i.p,n:P(i.p).nombre,q:i.q,costo:i.costo})),total,pago,pagada:pago!=='pendiente',nota:nota||''};S.com.push(c);save();return c}
function saldoCli(id){return S.ven.filter(v=>!v.anulada&&v.cli===id&&v.medio==='fiado').reduce((a,v)=>a+v.total,0)-S.abo.filter(a=>a.cli===id).reduce((a,b)=>a+b.valor,0)}
const vOk=()=>S.ven.filter(v=>!v.anulada);
const utilV=v=>v.items.reduce((a,i)=>a+i.q*(i.precio-i.costo),0)-v.desc;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function modal(h,w){$('#ov').innerHTML=`<div class="m ${w?'w':''}">${h}</div>`;$('#ov').classList.add('on')}
function closeM(){stopCam();$('#ov').classList.remove('on');$('#ov').innerHTML=''}
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
function descarga(nombre,txt,tipo){const b=new Blob([txt],{type:tipo||'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
function csv(nombre,rows){descarga(nombre,'﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
const tel=t=>{let d=String(t||'').replace(/\D/g,'');if(d.length===10&&d[0]==='3')d='57'+d;return d};
const wa=(t,txt)=>'https://wa.me/'+tel(t)+'?text='+encodeURIComponent(txt);

/* ---------- Selector de producto con lista (sirve con lector de código) ---------- */
const plist=()=>`<datalist id="plist">${S.prod.filter(p=>p.act!==false).map(p=>`<option value="${esc(p.cod?p.cod+' · '+p.nombre:p.nombre)}"></option>`).join('')}</datalist>`;
function findP(txt){txt=String(txt||'').trim();if(!txt)return null;const l=txt.toLowerCase();
 return S.prod.find(p=>p.act!==false&&((p.cod&&p.cod===txt)||(p.cod?p.cod+' · '+p.nombre:p.nombre).toLowerCase()===l))||S.prod.find(p=>p.act!==false&&p.nombre.toLowerCase()===l)||null}

/* ---------- Cámara: lector de código de barras ---------- */
let camCb=null;
async function scan(cb){camCb=cb;
 if(!('BarcodeDetector' in window)){toast('Este equipo no tiene lector por cámara. Usa el lector USB o escribe el código.');return}
 modal(`<h3>Escanear código</h3>${camBox()}<p style="color:var(--mu);font-size:13px">Pon <b>un solo</b> código dentro del recuadro naranja. Funciona sin internet.</p><div class="tb"><span class="sp"></span><button class="btn sec" onclick="closeM()">Cerrar</button></div>`);
 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});cam={stream,on:true};const v=$('#cv');v.srcObject=stream;await v.play();camFit(v);
  const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});let cand='',n=0;
  const loop=async()=>{if(!cam||!cam.on)return;try{const code=await leerCentro(det,v);if(code){if(code===cand)n++;else{cand=code;n=1}if(n>=2){stopCam();closeM();if(navigator.vibrate)navigator.vibrate(60);camCb&&camCb(code);return}}else{cand='';n=0}}catch(e){}setTimeout(loop,150)};loop()}
 catch(e){closeM();toast('No se pudo abrir la cámara (revisa el permiso).')}}
function stopCam(){if(cam){cam.on=false;try{cam.stream.getTracks().forEach(t=>t.stop())}catch(e){}cam=null}}

/* ---------- Pantallas ---------- */
const NAV=[['inicio','🏠','Inicio'],['vender','🛒','Vender'],['prod','📦','Productos'],['compras','🚚','Compras'],['salidas','↩️','Salidas'],['fiado','📒','Fiado'],['caja','💵','Caja'],['gastos','💸','Gastos'],['rep','📊','Reportes'],['cfg','⚙️','Ajustes']];
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){if(!S)return;const a=$('#app');
 if(locked){a.innerHTML=`<div class="lock"><h2>${esc(S.cfg.nombre)}</h2><p>Escribe tu PIN</p><input id="pin" type="password" inputmode="numeric" maxlength="8" onkeydown="if(event.key==='Enter')unlock()"><p><button class="btn" onclick="unlock()">Entrar</button></p></div>`;setTimeout(()=>{const p=$('#pin');p&&p.focus()},50);return}
 const c=S.cfg,on=navigator.onLine;
 a.innerHTML=`<header class="top">${c.logo?`<img src="${c.logo}" alt="">`:''}<b>${esc(c.nombre)}</b><span class="dot ${on?'':'off'}">${on?'En línea':'Sin conexión · todo funciona'}</span></header><main>${V[view]()}</main><nav class="bar">${NAV.map(n=>`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`;
 if(view==='vender'){renderCart();posSearch('');const q=$('#q');if(q&&innerWidth>900)q.focus()}}
function unlock(){if(val('pin')===S.cfg.pin){locked=false;render()}else{toast('PIN incorrecto');const p=$('#pin');if(p)p.value=''}}
const V={};
function banners(){let h='';const c=S.cfg,tiene=S.ven.length||S.mov.length;
 if(tiene&&(!c.resp||diffD(hoy(),c.resp)>=7))h+=`<div class="banner rd">⚠️ ${c.resp?'Hace '+diffD(hoy(),c.resp)+' días no haces copia de seguridad.':'Aún no has hecho copia de seguridad.'} Si se pierde el celular, se pierde la información. <button class="btn sm" onclick="exportar(true)">Hacer copia ahora</button></div>`;
 return h}
function barSVG(d,col){const W=330,H=150,m=Math.max(1,...d.map(x=>x.v)),bw=W/d.length;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:190px">${d.map((x,i)=>{const h=Math.round((H-38)*x.v/m);return `<rect x="${i*bw+6}" y="${H-22-h}" width="${bw-12}" height="${Math.max(h,x.v?2:0)}" rx="4" fill="${col||'var(--c)'}"/><text x="${i*bw+bw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="#6b7c88">${x.l}</text>${x.v?`<text x="${i*bw+bw/2}" y="${H-26-h}" text-anchor="middle" font-size="9" fill="#1d2b36">${x.v>=1000?Math.round(x.v/1000)+'k':x.v}</text>`:''}`}).join('')}</svg>`}
const DIAS=['D','L','M','M','J','V','S'];
V.inicio=()=>{const h=hoy(),vs=vOk(),vh=vs.filter(v=>v.f===h),mes=h.slice(0,7),vm=vs.filter(v=>v.f.slice(0,7)===mes);
 const sum=a=>a.reduce((s,v)=>s+v.total,0),ut=a=>a.reduce((s,v)=>s+utilV(v),0);
 const inv=S.prod.filter(p=>!isKit(p)).reduce((a,p)=>a+Math.max(0,p.stock)*p.costo,0);
 const bajos=S.prod.filter(p=>!isKit(p)&&p.act!==false&&p.min>0&&p.stock<=p.min);
 const cobrar=S.cli.reduce((a,c)=>a+Math.max(0,saldoCli(c.id)),0);
 const dias=[...Array(7)].map((_,i)=>{const f=addD(h,i-6);return{l:DIAS[new Date(f+'T12:00:00').getDay()],v:sum(vs.filter(v=>v.f===f))}});
 const top={};vm.forEach(v=>v.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.q*i.precio));
 const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=tp.length?tp[0][1]:1;
 return `${banners()}<h2>Resumen de hoy</h2>

V.vender=()=>`<div class="pos"><div><h2>Vender</h2><div class="card"><div class="ml"><input id="q" placeholder="Escanea o escribe nombre / código y Enter" oninput="posSearch(this.value)" onkeydown="posKey(event)" autocomplete="off"><button class="btn am" onclick="scan(posCode)">📷</button></div><div id="res" style="margin-top:10px"></div></div></div><div><h2>Cuenta</h2><div class="tb"><button class="btn sec sm" onclick="listaPick()">📋 Lista de útiles</button></div><div class="card" id="cart"></div></div></div>`;
function posSearch(q){const e=$('#res');if(!e)return;q=(q||'').trim().toLowerCase();let L;
 if(!q){const cnt={};vOk().filter(v=>diffD(hoy(),v.f)<=30).forEach(v=>v.items.forEach(i=>cnt[i.p]=(cnt[i.p]||0)+i.q));L=S.prod.filter(p=>p.act!==false).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)).slice(0,8);var t='Más vendidos';}
 else{L=S.prod.filter(p=>p.act!==false&&((p.nombre+' '+(p.cod||'')+' '+(p.cat||'')).toLowerCase().includes(q))).slice(0,14);t='Resultados'}
 e.innerHTML=(S.prod.length?`<small style="color:var(--mu)">${t}</small><div class="pick">${L.map(p=>`<button onclick="addCart('${p.id}')">${esc(p.nombre)}<small>${fmt(p.precio)} · ${isKit(p)?'kit':'stock'} ${disp(p)}</small></button>`).join('')||'<span style="color:var(--mu)">Sin resultados</span>'}</div>`:'<p style="color:var(--mu)">Primero crea tus productos en 📦 Productos (o carga datos de ejemplo en ⚙️ Ajustes).</p>')}
function posKey(e){if(e.key!=='Enter')return;const q=e.target.value.trim();if(!q)return;const ex=S.prod.find(p=>p.act!==false&&p.cod&&p.cod===q);if(ex){addCart(ex.id);e.target.value='';posSearch('');return}
 const L=S.prod.filter(p=>p.act!==false&&p.nombre.toLowerCase().includes(q.toLowerCase()));if(L.length===1){addCart(L[0].id);e.target.value='';posSearch('')}else toast(L.length?'Elige el producto de la lista':'No existe ese producto')}
function posCode(code){const p=S.prod.find(x=>x.act!==false&&x.cod===code);if(p){addCart(p.id)}else{toast('Código '+code+' no registrado');const q=$('#q');if(q){q.value=code;posSearch(code)}}}
function addCart(id,n){const p=P(id);if(!p)return;n=n||1;let it=cart.find(x=>x.p===id);const ya=it?it.q:0;
 if(!S.cfg.neg&&ya+n>disp(p)){toast('Stock insuficiente de '+p.nombre+' (hay '+disp(p)+')');return}
 if(it)it.q=r3(it.q+n);else{it={p:id,q:n,precio:p.precio};cart.push(it)}autoPr(it);renderCart();if(navigator.vibrate)navigator.vibrate(20)}
function setQ(i,v){const it=cart[i],p=P(it.p);v=num(v);if(v<=0){cart.splice(i,1)}else{if(!S.cfg.neg&&v>disp(p)){toast('Solo hay '+disp(p));v=disp(p)}it.q=v;autoPr(it)}renderCart()}
function setPr(i,v){cart[i].precio=Math.max(0,num(v));cart[i].man=true;renderCart(true)}
function renderCart(keep){const e=$('#cart');if(!e)return;const sub=cart.reduce((a,i)=>a+i.q*i.precio,0);const d=Math.min(sub,num(val('desc')||0)),tot=sub-d,medio=val('medio')||'efectivo';
 const f=document.activeElement&&document.activeElement.id;
 e.innerHTML=(cart.length?cart.map((it,i)=>{const p=P(it.p);return `<div class="cartrow"><div><b>${esc(p.nombre)}</b>${isKit(p)?' <span class="pill am">kit</span>':''}<div class="ml" style="margin-top:3px"><small>Precio</small><input style="width:90px;padding:4px 6px" type="number" inputmode="decimal" value="${it.precio}" onchange="setPr(${i},this.value)"></div></div><div class="r"><div class="qty"><button onclick="setQ(${i},${it.q}-1)">−</button><input type="number" inputmode="decimal" value="${it.q}" onchange="setQ(${i},this.value)"><button onclick="setQ(${i},${it.q}+1)">+</button></div><b>${fmt(it.q*it.precio)}</b></div></div>`}).join(''):'<p style="color:var(--mu)">La cuenta está vacía. Escanea o toca un producto.</p>')+
 `<div class="f2"><div><label>Descuento ($)</label><input id="desc" type="number" inputmode="decimal" value="${d||''}" oninput="renderCart(true)"></div><div><label>Medio de pago</label><select id="medio" onchange="renderCart(true)">${[['efectivo','Efectivo'],['nequi','Nequi / Daviplata'],['transferencia','Transferencia'],['tarjeta','Tarjeta'],['fiado','Fiado (queda debiendo)']].map(m=>`<option value="${m[0]}" ${medio===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select></div></div>
 ${medio==='fiado'?`<label>Cliente</label><select id="cli"><option value="">— elige —</option>${S.cli.map(c=>`<option value="${c.id}" ${val('cli')===c.id?'selected':''}>${esc(c.nombre)} (debe ${fmt(Math.max(0,saldoCli(c.id)))})</option>`).join('')}</select><p><a href="#" onclick="cliForm();return false">+ Nuevo cliente</a></p>`:''}
 ${medio==='efectivo'?`<label>Recibido en efectivo</label><input id="rec" type="number" inputmode="decimal" value="${val('rec')}" oninput="vuelto()"><div id="vue" style="margin-top:4px;color:var(--ok);font-weight:700"></div>`:''}
 <div style="margin:12px 0 6px">Total a cobrar</div><div class="big">${fmt(tot)}</div><div class="tb" style="margin-top:10px"><button class="btn" ${cart.length?'':'disabled'} onclick="cobrar()">Cobrar</button><button class="btn sec" ${cart.length?'':'disabled'} onclick="if(confirm('¿Vaciar la cuenta?')){cart=[];renderCart()}">Vaciar</button></div>`;
 if(f){const x=document.getElementById(f);if(x&&x.tagName==='INPUT'){x.focus();try{x.setSelectionRange(x.value.length,x.value.length)}catch(e){}}}vuelto()}
function vuelto(){const e=$('#vue');if(!e)return;const sub=cart.reduce((a,i)=>a+i.q*i.precio,0),tot=sub-Math.min(sub,num(val('desc')||0)),r=num(val('rec'));e.textContent=r>0?(r>=tot?'Vuelto: '+fmt(r-tot):'Faltan '+fmt(tot-r)):''}
function cobrar(){if(!cart.length)return;const sub=cart.reduce((a,i)=>a+i.q*i.precio,0),d=Math.min(sub,num(val('desc'))),medio=val('medio')||'efectivo',cli=val('cli');
 if(medio==='fiado'&&!cli){toast('Elige el cliente del fiado');return}
 for(const it of cart){const p=P(it.p);if(!S.cfg.neg&&it.q>disp(p)){toast('Stock insuficiente de '+p.nombre);return}}
 const v=crearVenta(cart,medio,cli,d);cart=[];render();ticket(v.id,true)}
function ticketTxt(v){return `${S.cfg.nombre}\nVenta ${v.num} · ${v.f} ${v.h}\n`+(v.cli?'Cliente: '+cliN(v.cli)+'\n':'')+'------------------------\n'+v.items.map(i=>`${i.q} x ${i.n}\n   ${fmt(i.q*i.precio)}`).join('\n')+'\n------------------------\n'+(v.desc?'Descuento: '+fmt(v.desc)+'\n':'')+`TOTAL: ${fmt(v.total)}\nPago: ${v.medio}${v.medio==='fiado'?' (queda debiendo)':''}\n¡Gracias por tu compra!`}

 modal(`<h3>${nuevaV?'✔ Venta registrada':'Venta '+v.num}${v.anulada?' (ANULADA)':''}</h3><div class="ticket">${esc(t)}</div><div class="tb noprint" style="margin-top:10px"><a class="btn" style="text-decoration:none" target="_blank" href="${wa(c?c.tel:'',t)}">📲 WhatsApp</a><button class="btn sec" onclick="window.print()">🖨 Imprimir</button>${!v.anulada&&!nuevaV?`<button class="btn rd" onclick="anular('${v.id}')">Anular venta</button>`:''}<span class="sp"></span><button class="btn sec" onclick="closeM()">Cerrar</button></div>`)}
function anular(id){if(!confirm('¿Anular esta venta? El stock vuelve al inventario.'))return;const v=S.ven.find(x=>x.id===id);stamp();
 v.items.forEach(i=>{const p=P(i.p);if(!p)return;if(isKit(p))p.kit.forEach(k=>{const c=P(k.id);if(c)mover(c,i.q*k.q,'anulación',v.num)});else mover(p,i.q,'anulación',v.num)});v.anulada=true;save();closeM();toast('Venta anulada');render()}

 if(pq)L=L.filter(p=>(p.nombre+' '+(p.cod||'')).toLowerCase().includes(pq.toLowerCase()));if(pcat)L=L.filter(p=>p.cat===pcat);

 if(cod&&S.prod.some(p=>p.cod===cod&&p.id!==id&&p.act!==false)){toast('Ese código ya está en otro producto');return}

 <div class="f2"><div><label>Forma de pago</label><select onchange="cc.pago=this.value"><option value="efectivo" ${cc.pago==='efectivo'?'selected':''}>Efectivo</option><option value="transferencia" ${cc.pago==='transferencia'?'selected':''}>Transferencia / Nequi</option><option value="pendiente" ${cc.pago==='pendiente'?'selected':''}>Pendiente (a crédito)</option></select></div><div><label>Nota (n.º factura)</label><input value="${esc(cc.nota)}" onchange="cc.nota=this.value"></div></div><p>Total: <b id="c_t">${fmt(t)}</b></p><div class="tb"><span class="sp"></span><button class="btn sec" onclick="closeM()">Cancelar</button><button class="btn" onclick="cSave()">Registrar compra</button></div>`,true)}
function cAdd(){const p=findP(val('c_q'));if(!p||isKit(p)){toast('No encuentro ese producto');return}const x=cc.items.find(i=>i.p===p.id);if(x)x.q+=1;else cc.items.push({p:p.id,q:1,costo:p.costo||0});compraUI();setTimeout(()=>{const q=$('#c_q');q&&q.focus()},30)}

 const g={};L.forEach(p=>{(g[p.prov||'']=g[p.prov||'']||[]).push(p)});
 modal(`<h3>Pedido sugerido</h3><p style="color:var(--mu);font-size:13px">Cantidad sugerida = para llegar al doble del mínimo. Puedes cambiarla antes de enviar.</p>${Object.entries(g).map(([pid,ps])=>{const pv=S.prv.find(x=>x.id===pid);return `<div class="card"><b>${pv?esc(pv.nombre):'Sin proveedor asignado'}</b>${ps.map(p=>`<div class="row"><div class="g">${esc(p.nombre)}<small>Hay ${p.stock} · mínimo ${p.min}</small></div><input type="number" style="width:80px" data-ped="${pid}" data-n="${esc(p.nombre)}" value="${Math.max(1,Math.ceil(p.min*2-p.stock))}"></div>`).join('')}<div class="tb" style="margin-top:8px"><button class="btn" onclick="pedWa('${pid}')">📲 Enviar por WhatsApp</button></div></div>`}).join('')}<div class="tb"><span class="sp"></span><button class="btn sec" onclick="closeM()">Cerrar</button></div>`,true)}
function pedWa(pid){const pv=S.prv.find(x=>x.id===pid),its=[...document.querySelectorAll('[data-ped="'+pid+'"]')].filter(i=>num(i.value)>0).map(i=>`• ${i.value} × ${i.dataset.n}`);
 const t=`Hola${pv?' '+pv.nombre:''}, necesito hacer este pedido para ${S.cfg.nombre}:\n`+its.join('\n')+'\nGracias.';window.open(wa(pv?pv.tel:'',t),'_blank')}

/* --- Salidas / ajustes --- */
const TS=[['Daño o pérdida',-1],['Consumo propio',-1],['Devolución al proveedor',-1],['Obsequio o muestra',-1],['Devolución de un cliente',1],['Ajuste por conteo (sobra)',1],['Ajuste por conteo (falta)',-1]];
V.salidas=()=>{const L=S.mov.filter(m=>!['venta','entrada','inicial'].includes(m.t)).slice().reverse().slice(0,80);
 return `<h2>Otras salidas y ajustes</h2><p style="color:var(--mu)">Las ventas y compras se registran solas. Aquí va todo lo demás que cambia el inventario: daños, consumo propio, devoluciones y conteos.</p>${plist()}
 <div class="card"><label>Producto (escribe o escanea)</label><div class="ml"><input id="s_p" list="plist"><button class="btn am" onclick="scan(c=>{$('#s_p').value=c})">📷</button></div><div class="f2"><div><label>Motivo</label><select id="s_t">${TS.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join('')}</select></div><div><label>Cantidad</label><input id="s_q" type="number" inputmode="decimal" value="1"></div></div><label>Nota (opcional)</label><input id="s_n"><p><button class="btn" onclick="salidaOk()">Registrar</button></p></div>
 <div class="card"><b>Últimos movimientos</b>${L.map(m=>`<div class="row"><div class="g">${esc(P(m.p)?P(m.p).nombre:'?')}<small>${m.f} ${m.h} · ${esc(m.t)}${m.nota?' · '+esc(m.nota):''}</small></div><b>${m.q>0?'+':''}${m.q}</b></div>`).join('')||'<p style="color:var(--mu)">Sin movimientos.</p>'}</div>`};
function salidaOk(){const p=findP(val('s_p'));if(!p||isKit(p)){toast('Elige un producto de la lista');return}const t=TS[+val('s_t')],q=num(val('s_q'));if(q<=0){toast('Cantidad inválida');return}
 if(t[1]<0&&q>p.stock){toast('Solo hay '+p.stock+' en stock');return}stamp();mover(p,t[1]*q,t[0],'',val('s_n'));save();toast('Registrado');render()}

/* --- Fiado --- */
V.fiado=()=>`<h2>Fiado (cuentas por cobrar)</h2><div class="tb"><button class="btn" onclick="cliForm()">+ Cliente</button></div><div class="card">${S.cli.length?S.cli.map(c=>{const s=saldoCli(c.id);return `<div class="row"><div class="g"><b>${esc(c.nombre)}</b><small>${esc(c.tel||'')}</small></div><b style="color:${s>0?'var(--rd)':'var(--ok)'}">${fmt(Math.max(0,s))}</b><button class="btn sm" ${s>0?'':'disabled'} onclick="aboForm('${c.id}')">Abonar</button><button class="btn sm sec" onclick="cliDet('${c.id}')">Detalle</button></div>`}).join(''):'<p style="color:var(--mu)">Aún no hay clientes con fiado.</p>'}</div>`;
function cliForm(id){const c=id?S.cli.find(x=>x.id===id):{nombre:'',tel:''};modal(`<h3>${id?'Editar':'Nuevo'} cliente</h3><label>Nombre</label><input id="cl_n" value="${esc(c.nombre)}"><label>WhatsApp / teléfono</label><input id="cl_t" inputmode="tel" value="${esc(c.tel)}"><div class="tb" style="margin-top:12px"><span class="sp"></span><button class="btn sec" onclick="closeM()">Cancelar</button><button class="btn" onclick="cliSave('${id||''}')">Guardar</button></div>`)}
function cliSave(id){const n=val('cl_n').trim();if(!n){toast('Escribe el nombre');return}let c;if(id){c=S.cli.find(x=>x.id===id);c.nombre=n;c.tel=val('cl_t')}else{c={id:uid(),nombre:n,tel:val('cl_t')};S.cli.push(c)}save();closeM();render();if(view==='vender'){setTimeout(()=>{const s=$('#cli');if(s)s.value=c.id},30)}}
function aboForm(id){const c=S.cli.find(x=>x.id===id);modal(`<h3>Abono de ${esc(c.nombre)}</h3><p>Debe: <b>${fmt(saldoCli(id))}</b></p><label>Valor del abono</label><input id="a_v" type="number" inputmode="decimal" value="${Math.max(0,saldoCli(id))}"><label>Medio</label><select id="a_m"><option value="efectivo">Efectivo</option><option value="nequi">Nequi / Daviplata</option><option value="transferencia">Transferencia</option></select><div class="tb" style="margin-top:12px"><span class="sp"></span><button class="btn sec" onclick="closeM()">Cancelar</button><button class="btn" onclick="aboOk('${id}')">Registrar abono</button></div>`)}
function aboOk(id){const v=num(val('a_v'));if(v<=0){toast('Valor inválido');return}if(v>saldoCli(id)+0.5){toast('El abono supera la deuda');return}S.abo.push({id:uid(),cli:id,f:hoy(),h:ahora(),valor:v,medio:val('a_m')});save();closeM();toast('Abono registrado');render()}
function cliDet(id){const c=S.cli.find(x=>x.id===id),vs=S.ven.filter(v=>!v.anulada&&v.cli===id&&v.medio==='fiado'),ab=S.abo.filter(a=>a.cli===id);const s=saldoCli(id);
 const t=`Hola ${c.nombre}, te recordamos que tienes un saldo pendiente de ${fmt(s)} en ${S.cfg.nombre}. ¡Gracias!`;
 modal(`<h3>${esc(c.nombre)}</h3><p>Saldo: <b>${fmt(s)}</b></p>${vs.map(v=>`<div class="row"><div class="g">${v.num}<small>${v.f}</small></div><b>${fmt(v.total)}</b></div>`).join('')}${ab.map(a=>`<div class="row"><div class="g">Abono<small>${a.f} · ${a.medio}</small></div><b style="color:var(--ok)">− ${fmt(a.valor)}</b></div>`).join('')}<div class="tb" style="margin-top:10px">${s>0?`<a class="btn" style="text-decoration:none" target="_blank" href="${wa(c.tel,t)}">📲 Recordar por WhatsApp</a>`:''}<button class="btn sec" onclick="cliForm('${id}')">Editar</button><span class="sp"></span><button class="btn sec" onclick="closeM()">Cerrar</button></div>`)}

/* --- Caja --- */
let cajaF='';
function cajaDia(f){const vs=vOk().filter(v=>v.f===f),ef=vs.filter(v=>v.medio==='efectivo').reduce((a,v)=>a+v.total,0),dg=vs.filter(v=>!['efectivo','fiado'].includes(v.medio)).reduce((a,v)=>a+v.total,0),fi=vs.filter(v=>v.medio==='fiado').reduce((a,v)=>a+v.total,0),
 abE=S.abo.filter(a=>a.f===f&&a.medio==='efectivo').reduce((a,b)=>a+b.valor,0),abD=S.abo.filter(a=>a.f===f&&a.medio!=='efectivo').reduce((a,b)=>a+b.valor,0),
 ga=S.gas.filter(g=>g.f===f&&g.medio!=='otro').reduce((a,g)=>a+g.valor,0),co=S.com.filter(c=>(c.pagada&&c.pago==='efectivo'&&(c.fp||c.f)===f)).reduce((a,c)=>a+c.total,0),ut=vs.reduce((a,v)=>a+utilV(v),0);
 return{vs,ef,dg,fi,abE,abD,ga,co,ut,tot:vs.reduce((a,v)=>a+v.total,0)}}
V.caja=()=>{const f=cajaF||hoy(),d=cajaDia(f),ci=S.cie.find(c=>c.f===f),base=ci?ci.base:S.cfg.base||0,esp=base+d.ef+d.abE-d.ga-d.co;
 return `<h2>Cierre de caja</h2><div class="f2"><div><label>Día</label><input type="date" value="${f}" onchange="cajaF=this.value;render()"></div><div><label>Base con la que abriste ($)</label><input id="cj_b" type="number" inputmode="decimal" value="${base}" oninput="cajaCalc()"></div></div>
 <div class="grid" style="margin-top:10px"><div class="kpi"><small>Ventas del día</small><b>${fmt(d.tot)}</b></div><div class="kpi"><small>Ganancia del día</small><b>${fmt(d.ut)}</b></div><div class="kpi"><small>Ventas en efectivo</small><b>${fmt(d.ef)}</b></div><div class="kpi"><small>Nequi / transf. / tarjeta</small><b>${fmt(d.dg)}</b></div><div class="kpi"><small>Fiado del día</small><b>${fmt(d.fi)}</b></div><div class="kpi"><small>Abonos recibidos</small><b>${fmt(d.abE+d.abD)}</b></div></div>
 <div class="card"><div class="row"><div class="g">+ Base inicial</div><b id="x_b">${fmt(base)}</b></div><div class="row"><div class="g">+ Ventas en efectivo</div><b>${fmt(d.ef)}</b></div><div class="row"><div class="g">+ Abonos en efectivo</div><b>${fmt(d.abE)}</b></div><div class="row"><div class="g">− Gastos del día (<a href="#" onclick="gastoForm();return false">+ agregar</a>)</div><b>${fmt(d.ga)}</b></div><div class="row"><div class="g">− Compras pagadas en efectivo</div><b>${fmt(d.co)}</b></div><div class="row"><div class="g"><b>Efectivo que debe haber</b></div><b id="x_e">${fmt(esp)}</b></div>
 <label>Efectivo contado en la caja</label><input id="cj_c" type="number" inputmode="decimal" value="${ci?ci.contado:''}" oninput="cajaCalc()"><div id="x_d" style="margin:8px 0;font-weight:700"></div><label>Nota</label><input id="cj_n" value="${ci?esc(ci.nota):''}"><p><button class="btn" onclick="cajaSave('${f}')">${ci?'Actualizar cierre':'Guardar cierre del día'}</button></p></div>
 ${S.gas.filter(g=>g.f===f).length?`<div class="card"><b>Gastos de este día</b>${S.gas.filter(g=>g.f===f).map(g=>`<div class="row"><div class="g">${esc(g.concepto)}</div><b>${fmt(g.valor)}</b><button class="btn sm sec" onclick="S.gas=S.gas.filter(x=>x.id!=='${g.id}');save();render()">✕</button></div>`).join('')}</div>`:''}
 <div class="card"><b>Cierres anteriores</b>${S.cie.slice().reverse().slice(0,15).map(c=>`<div class="row"><div class="g">${c.f}<small>Esperado ${fmt(c.esperado)} · contado ${fmt(c.contado)}</small></div><span class="pill ${Math.abs(c.dif)<1?'ok':'rd'}">${Math.abs(c.dif)<1?'Cuadra':(c.dif>0?'Sobra ':'Falta ')+fmt(Math.abs(c.dif))}</span></div>`).join('')||'<p style="color:var(--mu)">Aún no hay cierres.</p>'}</div>`};
function cajaCalc(){const f=cajaF||hoy(),d=cajaDia(f),b=num(val('cj_b')),esp=b+d.ef+d.abE-d.ga-d.co,c=val('cj_c');$('#x_b').textContent=fmt(b);$('#x_e').textContent=fmt(esp);const e=$('#x_d');if(c===''){e.textContent='';return}const df=num(c)-esp;e.style.color=Math.abs(df)<1?'var(--ok)':'var(--rd)';e.textContent=Math.abs(df)<1?'✔ La caja cuadra':(df>0?'Sobran ':'Faltan ')+fmt(Math.abs(df))}
function cajaSave(f){const d=cajaDia(f),b=num(val('cj_b')),esp=b+d.ef+d.abE-d.ga-d.co;if(val('cj_c')===''){toast('Escribe el efectivo contado');return}const o={id:uid(),f,base:b,esperado:esp,contado:num(val('cj_c')),dif:num(val('cj_c'))-esp,nota:val('cj_n'),ventas:d.tot,ganancia:d.ut};const i=S.cie.findIndex(c=>c.f===f);if(i>=0)S.cie[i]=o;else S.cie.push(o);S.cfg.base=b;save();toast('Cierre guardado');render()}

/* --- Reportes --- */
let rp={r:'7',d:'',h:'',pk:''};
function rango(){const h=hoy();if(rp.r==='hoy')return[h,h];if(rp.r==='7')return[addD(h,-6),h];if(rp.r==='mes')return[h.slice(0,8)+'01',h];if(rp.r==='todo')return['0000-00-00','9999-99-99'];return[rp.d||h,rp.h||h]}
V.rep=()=>{const [d,h]=rango(),vs=vOk().filter(v=>v.f>=d&&v.f<=h),tot=vs.reduce((a,v)=>a+v.total,0),ut=vs.reduce((a,v)=>a+utilV(v),0);
 const pd={};vs.forEach(v=>{pd[v.f]=pd[v.f]||{n:0,t:0,u:0};pd[v.f].n++;pd[v.f].t+=v.total;pd[v.f].u+=utilV(v)});
 const pp={},pc={};vs.forEach(v=>v.items.forEach(i=>{const p=P(i.p);const o=pp[i.p]=pp[i.p]||{n:i.n,q:0,t:0,u:0};o.q+=i.q;o.t+=i.q*i.precio;o.u+=i.q*(i.precio-i.costo);const c=(p&&p.cat)||'Sin categoría';pc[c]=(pc[c]||0)+i.q*i.precio}));
 const top=Object.values(pp).sort((a,b)=>b.q-a.q),vend=new Set(Object.keys(pp));
 const quietos=S.prod.filter(p=>p.act!==false&&!isKit(p)&&p.stock>0&&!vend.has(p.id)),inv=S.prod.filter(p=>!isKit(p)&&p.act!==false);
 const medios={};vs.forEach(v=>medios[v.medio]=(medios[v.medio]||0)+v.total);
 return `<h2>Reportes</h2><div class="f3" style="margin-bottom:10px"><select onchange="rp.r=this.value;render()">${[['hoy','Hoy'],['7','Últimos 7 días'],['mes','Este mes'],['todo','Todo'],['x','Rango']].map(o=>`<option value="${o[0]}" ${rp.r===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>${rp.r==='x'?`<input type="date" value="${rp.d}" onchange="rp.d=this.value;render()"><input type="date" value="${rp.h}" onchange="rp.h=this.value;render()">`:''}</div>
 <div class="grid"><div class="kpi"><small>Ventas</small><b>${fmt(tot)}</b></div><div class="kpi"><small>N.º de ventas</small><b>${vs.length}</b></div><div class="kpi"><small>Ganancia</small><b>${fmt(ut)}</b></div><div class="kpi"><small>Margen</small><b>${tot?Math.round(ut/tot*100):0}%</b></div><div class="kpi"><small>Venta promedio</small><b>${fmt(vs.length?tot/vs.length:0)}</b></div></div>
 ${resCard(d,h)}
 <div class="tb"><button class="btn sm" onclick="informe()">🖨 Informe PDF</button><button class="btn sec sm" onclick="expVentas()">Ventas a Excel</button><button class="btn sec sm" onclick="expProd()">Inventario a Excel</button></div>
 <div class="card"><b>Ventas por día</b><div class="tw"><table class="t"><tr><th>Día</th><th class="r">Ventas</th><th class="r">Total</th><th class="r">Ganancia</th></tr>${Object.entries(pd).sort().reverse().map(([f,o])=>`<tr><td>${f}</td><td class="r">${o.n}</td><td class="r">${fmt(o.t)}</td><td class="r">${fmt(o.u)}</td></tr>`).join('')||'<tr><td colspan=4>Sin ventas en el período</td></tr>'}</table></div></div>
 <div class="card"><b>Ventas por medio de pago</b>${Object.entries(medios).map(([m,v])=>`<div class="row"><div class="g">${esc(m)}</div><b>${fmt(v)}</b></div>`).join('')||'<p style="color:var(--mu)">—</p>'}</div>
 <div class="card"><b>Ventas por categoría</b>${Object.entries(pc).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div class="row"><div class="g">${esc(m)}</div><b>${fmt(v)}</b></div>`).join('')||'<p style="color:var(--mu)">—</p>'}</div>

/* --- lectura SOLO de la franja central (evita leer varios códigos a la vez) --- */
const _cv=document.createElement('canvas');
async function leerCentro(det,v){const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;const w=Math.round(vw*.7),h=Math.round(vh*.3),sx=Math.round((vw-w)/2),sy=Math.round((vh-h)/2);_cv.width=w;_cv.height=h;_cv.getContext('2d').drawImage(v,sx,sy,w,h,0,0,w,h);
 const r=await det.detect(_cv);if(!r.length)return null;let best=r[0],bd=1e9;r.forEach(x=>{const p=x.cornerPoints||[],cx=p.length?p.reduce((a,q)=>a+q.x,0)/p.length:w/2,d=Math.abs(cx-w/2);if(d<bd){bd=d;best=x}});return best.rawValue}
const camBox=()=>'<div class="camw" id="camw"><video class="cam" id="cv" playsinline muted></video><i class="aim"></i></div>';
function camFit(v){const w=$('#camw');if(w&&v.videoWidth){w.style.aspectRatio=v.videoWidth+'/'+v.videoHeight;w.classList.add('on')}}
/* --- escáner continuo (la cámara queda abierta) --- */
async function contScan(cb){
 if(!('BarcodeDetector' in window))return false;
 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});cam={stream,on:true,pause:false};const v=$('#cv');v.srcObject=stream;await v.play();camFit(v);
  const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});let last='',lt=0,cand='',n=0,libre=true;
  const loop=async()=>{if(!cam||!cam.on)return;try{if(!cam.pause){const c=await leerCentro(det,v),t=Date.now();if(!c){libre=true;cand='';n=0}else{if(c===cand)n++;else{cand=c;n=1}
   if(n>=2&&(libre||c!==last||t-lt>2500)){cb(c);last=c;lt=t;libre=false;n=0}}}}catch(e){}setTimeout(loop,150)};loop();return true}
 catch(e){toast('No se pudo abrir la cámara (revisa el permiso).');return false}}
async function camToggle(cb){if(cam&&cam.on){stopCam();const w=$('#camw');if(w)w.classList.remove('on');return}const ok=await contScan(cb);if(!ok&&!('BarcodeDetector' in window))toast('Este equipo no lee códigos con la cámara. Usa el lector USB o escribe el código.')}

function csvParse(t){t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'',sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',',rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=''}else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}
 if(c!==''||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(y=>String(y).trim()!==''))}
const sinAc=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();

function impProd(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const R=csvParse(rd.result);if(R.length<2){toast('El archivo está vacío');return}

 if(ci.n<0){toast('No encuentro la columna “nombre”. Usa la plantilla.');return}
 let nu=0,up=0,om=0;stamp();
 R.slice(1).forEach(r=>{const g=k=>ci[k]>=0?String(r[ci[k]]||'').trim():'',nom=g('n');if(!nom){om++;return}const cod=g('cod');let pv='';const pn=g('pv');if(pn){let x=S.prv.find(y=>sinAc(y.nombre)===sinAc(pn));if(!x){x={id:uid(),nombre:pn,tel:''};S.prv.push(x)}pv=x.id}
  let p=cod?S.prod.find(x=>x.cod===cod&&x.act!==false):null;
  if(p){p.nombre=nom;if(g('cat'))p.cat=g('cat');if(g('c'))p.costo=numCO(g('c'));if(g('p'))p.precio=numCO(g('p'));if(pv)p.prov=pv;up++}
  else{p={id:uid(),cod,nombre:nom,cat:g('cat'),costo:numCO(g('c')),precio:numCO(g('p')),stock:0,min:numCO(g('m')),prov:pv,act:true,kit:null};S.prod.push(p);const s=numCO(g('s'));if(s>0)mover(p,s,'inicial','','Importado');nu++}});
 save();render();modal(`<h3>✔ Importación lista</h3><p>Productos nuevos: <b>${nu}</b><br>Actualizados: <b>${up}</b><br>Filas omitidas (sin nombre): <b>${om}</b></p><div class="tb"><span class="sp"></span><button class="btn" onclick="closeM()">Cerrar</button></div>`)};rd.readAsText(f)}

/* --- CÓDIGOS Y ETIQUETAS (EAN-13) --- */
const eanChk=d=>{let s=0;for(let i=0;i<12;i++)s+=(+d[i])*(i%2?3:1);return String((10-s%10)%10)};

const EL=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],ER_=EL.map(x=>x.split('').map(b=>b==='0'?'1':'0').join('')),EG=ER_.map(x=>x.split('').reverse().join('')),EP=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

 let r='';for(let i=0;i<b.length;i++)if(b[i]==='1')r+=`<rect x="${i+9}" y="0" width="1" height="52"/>`;
 return `<svg viewBox="0 0 113 64" xmlns="http://www.w3.org/2000/svg"><g fill="#000">${r}</g><text x="2" y="62" font-size="9" font-family="Arial">${code[0]}</text><text x="12" y="62" font-size="9" font-family="Arial" letter-spacing="1.3">${code.slice(1,7)}</text><text x="59" y="62" font-size="9" font-family="Arial" letter-spacing="1.3">${code.slice(7)}</text></svg>`}

 modal(`<h3>🏷 Etiquetas de código de barras</h3><p style="color:var(--mu);font-size:13px">Marca los productos y cuántas etiquetas quieres de cada uno. Solo salen los productos con código de 13 dígitos (EAN-13). Para los demás, edita el producto y toca “Generar”.</p><div style="max-height:46vh;overflow:auto">${L.map(p=>`<div class="row"><input type="checkbox" style="width:auto" data-e="${p.id}"><div class="g">${esc(p.nombre)}<small>${p.cod}</small></div><input type="number" min="1" value="1" style="width:64px" data-n="${p.id}"></div>`).join('')||'<p>No hay productos con código de 13 dígitos.</p>'}</div><div class="tb" style="margin-top:10px"><button class="btn" onclick="etqPrint()">Imprimir etiquetas</button><span class="sp"></span><button class="btn sec" onclick="closeM()">Cerrar</button></div>`,true)}

 const t=`📊 *${S.cfg.nombre}* — resumen del ${h}\n\nVentas: ${fmt(r.ventas)} (${vs.length} ventas)\nGanancia bruta: ${fmt(r.bruta)}\nEfectivo: ${fmt(d.ef)} · Digital: ${fmt(d.dg)} · Fiado: ${fmt(d.fi)}\nGastos del día: ${fmt(d.ga)}\n`+(tp.length?'\nMás vendidos:\n'+tp.map(x=>`• ${x[0]} (${x[1]})`).join('\n')+'\n':'')+`\nPor cobrar total: ${fmt(S.cli.reduce((a,c)=>a+Math.max(0,saldoCli(c.id)),0))}`;
 window.open(wa('',t),'_blank')}
